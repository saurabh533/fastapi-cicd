name: CD

# CD = "ship it." Only runs AFTER something lands on main (i.e. a merged PR).
# It rebuilds the image and pushes it to GitHub Container Registry (ghcr.io).
on:
  push:
    branches: [main]

# If two merges happen quickly, cancel the older in-flight deploy.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup

      # ghcr.io requires the image path to be lowercase.
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # ---- OPTIONAL: actually run the new image somewhere ----
      # The push above makes the image available. To "deploy" it you pull &
      # run it on your host. Example (SSH to your own VM) — uncomment and add
      # SERVER_HOST / SERVER_USER / SSH_KEY as repo secrets:
      #
      # - name: Deploy over SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SSH_KEY }}
      #     script: |
      #       docker pull ${{ env.IMAGE }}:latest
      #       docker rm -f demo-api || true
      #       docker run -d --name demo-api -p 80:8080 ${{ env.IMAGE }}:latest
