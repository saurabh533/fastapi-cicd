# GCP "CD" — runs on push to main via a Cloud Build trigger.
# test -> build image -> push to Artifact Registry -> deploy to Cloud Run.
#
# $PROJECT_ID is always provided by Cloud Build. _TAG defaults to "latest" so
# this file ALSO works with a manual `gcloud builds submit`; the cd-main
# trigger overrides it with the commit SHA (--substitutions='_TAG=$SHORT_SHA').
substitutions:
  _REGION: us-central1
  _REPO: demo            # Artifact Registry repository name
  _SERVICE: demo-api     # Cloud Run service name
  _TAG: latest           # trigger overrides this with $SHORT_SHA

steps:
  # 1. Fail fast: run the same tests before we ship anything.
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install -r requirements-dev.txt
        ruff check .
        pytest -v

  # 2. Build the image, tagged with _TAG (commit SHA in CD) and 'latest'.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 3. Push all tags to Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 4. Deploy the exact tag we just built to Cloud Run.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated   # public demo API; drop this to require auth

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
